name: Product checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run install:ci
      - run: npm test
      - run: npm run build
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test native review model and compile app
        working-directory: mac
        run: swift test
      - name: Build local Mac preview
        run: bash scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RetainerLens-mac-preview
          path: work/mac-release/*.zip
          retention-days: 7
